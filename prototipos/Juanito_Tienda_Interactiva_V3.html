const $=sel=>document.querySelector(sel);const money=n=>'S/ '+Number(n).toFixed(2);function p(id){return products.find(x=>x.id===Number(id))}function total(){return state.cart.reduce((a,o)=>a+p(o.id).price*o.qty,0)}function toast(s){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=s;document.body.append(e);setTimeout(()=>e.remove(),3000)}
const pic=(url,alt,extra='')=>`<img src="${url}" alt="${esc(alt)}" loading="lazy" ${extra} onerror="this.style.opacity='.02';this.closest('.photo,.product-img,.detail-main')?.classList.add('image-failed')">`;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(route,id){state.menu=false;state.route=route; if(id!==undefined)state.id=id; location.hash=route+(id!==undefined?'/'+id:''); render();window.scrollTo({top:0,behavior:'instant'});}function parseHash(){let [a,b]=location.hash.replace('#','').split('/');state.route=a||'inicio';if(b&&+b)state.id=+b;render();}window.addEventListener('hashchange',parseHash);

ck="go('catalogo')">Ver todo el catálogo →</button></div><div class="category-grid">${[['Danzas tradicionales','Vestimenta folclórica',img.wifalaPress,'Danzas tradicionales'],['Ternos y sastrería','Elegancia para cada evento',img.formalMan,'Ternos y sastrería'],['Moda para damas','Estilo y confección',img.formalWoman,'Ropa para damas'],['Ropa para niños','Pequeños grandes momentos',img.formalKids,'Ropa para niños']].map(([t,s,i,f])=>`<div class="category-card" onclick="state.filter='${f}';go('catalogo')">${pic(i,t)}<div><b>${t}</b><span>${s} ↗</span></div></div>`).join('')}</div></div></section><section class="section" style="padding-top:0"><div class="wrap"><div class="feature"><div class="feature-photo">${pic(img.wifalaGroup,'Wifalas San Francisco Javier de Muñani en presentación cultural')}</div><div class="feature-content"><div class="kicker">COLECCIÓN CULTURAL DESTACADA</div><h2>Wifalas San Francisco Javier de Muñani</h2><p>Una tradición originaria de Muñani, en la provincia de Azángaro, reconocida como Patrimonio Cultural de la Nación. La inspiración principal de nuestra propuesta visual.</p><p class="fine" style="color:#ffe7da">Las imágenes son referencias culturales de medios y Wikimedia, no fotografías del inventario de la tienda.</p><button class="btn gold" onclick="go('producto',1)">Descubrir la colección →</button></div></div></div></section><section class="section" style="padding-top:0"><div class="wrap"><div class="section-head"><div><div class="kicker">SELECCIÓN DE LA TIENDA</div><h2>Prendas destacadas</h2><p>Ideas para festividades, celebraciones y eventos formales.</p></div><button class="btn outline" onclick="go('catalogo')">Explorar todo →</button></div><div class="products-grid">${[products[0],products[1],products[4],products[5]].map(card).join('')}</div></div></section><section class="section"><div class="wrap"><div class="banner"><div><h2>¿Tienes una confección especial en mente?</h2><p>Cuéntanos la danza, talla, bordados o modelo que buscas. Te asesoramos.</p></div><button class="btn white" onclick="go('cotizacion')">Solicitar cotización ↗</button></div></div></section>`}

function addCart(id){const q=state.cart.find(x=>x.id===id&&x.size===state.size);q?q.qty+=state.qty:state.cart.push({id,qty:state.qty,size:state.size});state.qty=1;persist();render();toast('Producto agregado a tu carrito de consulta')}

function authSubmit(e,register){e.preventDefault();let d=new FormData(e.target);state.client={name:d.get('nombre')||String(d.get('correo')).split('@')[0],email:d.get('correo')};persist();go('cuenta');toast('Sesión de demostración iniciada')}
function favorites(){return pageHead('Mis favoritos','Tus diseños preferidos, reunidos para consultarlos cuando desees.')+`<section class="section"><div class="wrap"><div class="products-grid">${state.favs.map(i=>p(i)).filter(Boolean).map(card).join('')||'<div class="empty">Aún no guardaste favoritos. <p><button class="btn" onclick="go(\'catalogo\')">Explorar modelos</button></p></div>'}</div></section>`}
function account(){return !state.client?auth():pageHead('Mi cuenta','Un espacio para tus solicitudes, preferencias y datos de cliente.')+`<section class="section"><div class="wrap account-grid"><div class="panel account-nav"><div style="margin-bottom:21px"><div style="font-size:40px;color:var(--berry)">◉</div><b>${esc(state.client.name)}</b><p class="fine">${esc(state.client.email)}</p></div>${[['solicitudes','Mis solicitudes'],['favoritos','Mis favoritos'],['perfil','Mi perfil']].map(([x,t])=>`<button class="${state.view===x?'active':''}" onclick="state.view='${x}';render()">${t} ↗</button>`).join('')}<button onclick="delete state.client;persist();go('inicio')">Cerrar sesión</button></div><div class="panel"><h2 class="serif">${{solicitudes:'Mis solicitudes',favoritos:'Mis favoritos',perfil:'Mi perfil'}[state.view]||'Mis solicitudes'}</h2>${state.view==='solicitudes'?state.requests.map(o=>`<div class="cart-item" style="grid-template-columns:1fr auto"><div><b>${esc(o.code)}</b><small>${esc(o.date)} · ${esc(o.details)}</small><span class="tag teal">${esc(o.status)}</span></div><button class="btn outline sm" onclick="go('seguimiento')">Ver estado ↗</button></div>`).join(''):state.view==='favoritos'?`<div class="products-grid" style="grid-template-columns:repeat(2,1fr)">${state.favs.map(i=>p(i)).filter(Boolean).map(card).join('')||'<p>Sin favoritos todavía.</p>'}</div>`:`<div class="alert"><b>Cuenta de ejemplo</b><p>${esc(state.client.name)} · ${esc(state.client.email)}</p>La cuenta solo existe en este navegador.</div>`}</div></div></section>`}
function tracking(){return pageHead('Seguimiento de solicitudes','Consulta el avance ilustrativo de tu solicitud de confección.')+`<section class="section"><div class="wrap"><div class="panel" style="max-width:760px;margin:auto"><h2 class="serif">Estado de tus solicitudes</h2>${state.requests.map(o=>`<div style="padding:20px 0;border-bottom:1px solid var(--line)"><div class="row-between"><b>${esc(o.code)}</b><span class="tag teal">${esc(o.status)}</span></div><p class="fine">${esc(o.details)}</p><div class="progress"><i style="width:${o.status==='Completada'?'100%':o.status==='En atención'?'62%':'25%'}"></i></div><p class="fine">Recibida → En atención → Completada</p></div>`).join('')}</div></div></section>`}
function about(){return pageHead('Nuestra esencia','Tradición, creatividad y atención para cada ocasión.')+`<section class="section"><div class="wrap feature" style="background:white;color:var(--ink)"><div class="feature-photo">${pic(img.wifala,'Imagen histórica de Wifalas San Francisco de Muñani')}</div><div class="feature-content"><div class="kicker">TRADICIÓN Y ELEGANCIA</div><h2>Confecciones con identidad puneña</h2><p>Artesanias y Creaciones Juanito es una propuesta comercial de vestimenta tradicional, ternos, pantalones y ropa para hombres, mujeres y niños. Este diseño busca dar visibilidad a la riqueza cultural del altiplano.</p><button class="btn gold" onclick="go('contacto')">Hablemos de tu diseño →</button></div></div><p class="fine">La historia y los valores comerciales deben validarse con los propietarios antes de la publicación oficial.</p></div></section>`}
function contact(){return pageHead('Contáctanos','Te ayudamos con tallas, confección y cotizaciones especiales.')+`<section class="section"><div class="wrap split"><form class="panel" onsubmit="sendContact(event)"><h2 class="serif">Envíanos una consulta</h2><div class="form-grid"><label>Nombre *<input required name="name" placeholder="Tu nombre"></label><label>Correo electrónico *<input required type="email" name="email" placeholder="demo@ejemplo.test"></label><label>Tipo de consulta<select name="tipo"><option>Confección a medida</option><option>Vestimenta para agrupación</option><option>Información sobre un producto</option></select></label><label>Teléfono opcional<input name="telefono" placeholder="Contacto de ejemplo"></label><label class="full">Mensaje *<textarea required name="text" placeholder="Cuéntanos qué prenda o modelo buscas..."></textarea></label></div><p class="note">Este formulario guarda los datos solo en el navegador; no envía mensajes.</p><button class="btn" type="submit">Registrar consulta →</button></form><div class="summary-card"><div class="kicker">ATENCIÓN CON IDENTIDAD</div><h2 class="serif">Puno, Perú</h2><p class="muted">Consulta por prendas tradicionales y ropa formal, diseños para festividades, asociaciones culturales y ceremonias.</p><div class="alert">Flujo de contacto preparado para su conexión futura con el backend real.</div></div></div></section>`}
function sendContact(e){e.preventDefault();const d=new FormData(e.target);state.contacts.unshift({name:d.get('name'),email:d.get('email'),text:d.get('text'),status:'Pendiente'});persist();toast('Consulta guardada en el navegador (demostración)');e.target.reset()}
function credits(){return pageHead('Fotografías y fuentes','La calidad visual también requiere transparencia sobre los materiales utilizados.')+`<section class="section"><div class="wrap panel"><h2 class="serif">Créditos y derechos de autor</h2><p>Las fotografías culturales son imágenes reales de danzas puneñas. Las fotografías de moda son ejemplos de prendas, no stock confirmado de la tienda.</p><p>• Wifalas San Francisco de Muñani: <a style="color:var(--berry)" href="https://commons.wikimedia.org/wiki/File:Wifalas_San_Francisco_Mu%C3%B1ani-Azangaro-Puno-Peru.jpg" target="_blank">Wikimedia Commons · CC0</a>.</p><p>• Wifalas en festividad: <a style="color:var(--berry)" target="_blank" href="https://radioondaazul.com/escuela-profesional-medicina-humana-danza-wifalas-san-francisco-javier-de-munani-azangaro/">Radio Onda Azul</a> y <a style="color:var(--berry)" target="_blank" href="https://radioondaazul.com/reconocen-al-conjunto-wifalas-san-francisco-javier-de-munani-por-su-triunfo-en-el-concurso-de-danzas-originarias/">Radio Onda Azul 2025</a>. Fotografías enlazadas solo para referencia académica; gestionar permiso antes de publicarlas comercialmente.</p><p>• Morenada: <a style="color:var(--berry)" href="https://commons.wikimedia.org/wiki/File:Morenada_Bellavista_Puno.jpg" target="_blank">Ciudades · Wikimedia Commons · CC BY-SA 3.0</a>.</p><p>• Caporales: <a style="color:var(--berry)" href="https://commons.wikimedia.org/wiki/File:Caporales,_Puno-Peru2.jpg" target="_blank">Wikimedia Commons · CC0</a>.</p><p>• Diablada y Waca Waca: Wikimedia Commons. Verificar créditos específicos antes de su uso comercial.</p><p>• Pantalones clásicos: <a style="color:var(--berry)" target="_blank" href="https://www.pexels.com/photo/man-legs-with-elegant-shoes-9464625/">Pexels · Ron Lach</a>.<br>• Moda formal: <a style="color:var(--berry)" href="https://www.pexels.com/" target="_blank">Pexels</a>, imágenes de archivo para fines de maquetación.</p><div class="note">Para la versión de producción, sustituir las imágenes referenciales por fotos de los trajes fabricados por Artesanias y Creaciones Juanito y confirmar precios reales, tallas, plazos y contactos.</div></div></section>`}
function admin(){const selected=state.route==='admin'?'resumen':state.route.replace('admin-','');const links=[['resumen','Resumen general'],['productos','Gestionar productos'],['clientes','Directorio de clientes'],['solicitudes','Solicitudes'],['mensajes','Consultas recibidas']];const allCli=[...new Set(state.requests.map(x=>x.name)),...new Set(state.contacts.map(x=>x.name))];return `<div class="admin-shell"><aside class="admin-side"><a class="brand" href="#inicio"><div class="brand-mark">AJ</div><div><strong>JUANITO</strong><small>ADMIN DEMO</small></div></a>${links.map(([x,t])=>`<button class="${selected===x?'active':''}" onclick="go('${x==='resumen'?'admin':'admin-'+x}')">${t} →</button>`).join('')}<button onclick="go('inicio')" style="margin-top:15px">← Volver a la tienda</button></aside><div class="admin-content"><div class="row-between"><div><div class="kicker">GESTIÓN INTERNA · DEMOSTRACIÓN</div><h1>${{resumen:'Panel administrativo',productos:'Gestión de productos',clientes:'Clientes',solicitudes:'Solicitudes y cotizaciones',mensajes:'Consultas recibidas'}[selected]}</h1><p class="muted">Información simulada para exposición a propietarios e ingenieros.</p></div><span class="demo-badge">MODO DEMO</span></div>${adminInner(selected)}</div></div>`}
function adminInner(x){if(x==='resumen')return `<div class="stat-grid" style="margin:28px 0"><div class="stat"><small>Productos de muestra</small><strong>${products.length}</strong><span>Catálogo ilustrativo</span></div><div class="stat"><small>Solicitudes registradas</small><strong>${state.requests.length}</strong><span>Guardadas localmente</span></div><div class="stat"><small>Clientes de prueba</small><strong>${new Set(state.requests.map(o=>o.name)).size}</strong><span>Datos de demostración</span></div><div class="stat"><small>Consultas recibidas</small><strong>${state.contacts.length}</strong><span>Formularios de prueba</span></div></div><div class="split" style="grid-template-columns:1.45fr 1fr"><div class="panel"><h2 class="serif">Actividad ilustrativa</h2><p class="muted fine">Gráfica para demostrar el tablero, no datos históricos reales.</p><div class="bars">${[45,65,52,85,68,95,77,92].map((n,i)=>`<div style="height:${n}%"><b>${n}</b></div>`).join('')}</div><div class="row-between fine"><span>Semana 1</span><span>Semana 2</span><span>Semana 3</span><span>Semana 4</span></div></div><div class="panel"><h2 class="serif">Acciones rápidas</h2><p class="muted">Organiza la atención a tus clientes.</p><button class="btn wide" onclick="go('admin-productos')">Ver catálogo administrativo →</button><button class="btn dark wide" style="margin-top:12px" onclick="go('admin-solicitudes')">Revisar solicitudes →</button><div class="note" style="margin-top:20px">Acceso libre solo porque es una demostración. La web real requiere roles y autenticación segura.</div></div></div>`;
if(x==='productos')return `<div class="panel" style="margin-top:25px"><div class="row-between"><h2 class="serif">Inventario de referencia</h2><button class="btn" onclick="toast('Edición demostrativa: conectar con API para guardar productos reales')">＋ Agregar producto</button></div><div class="tablewrap"><table class="admin-table"><thead><tr><th>Producto</th><th>Categoría</th><th>Precio demo</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${products.map(o=>`<tr><td><b>${o.name}</b></td><td>${o.category}</td><td>${money(state.productsOverride[o.id]||o.price)}</td><td><span class="tag teal">Visible</span></td><td><button class="btn sm outline" onclick="editPrice(${o.id})">Editar precio</button></td></tr>`).join('')}</tbody></table></div></div>`;
if(x==='clientes'){const allCli=[...new Set(state.requests.map(x=>x.name)),...new Set(state.contacts.map(x=>x.name))];return `<div class="panel" style="margin-top:25px"><h2 class="serif">Contactos del prototipo</h2><p class="fine">Los nombres añadidos son datos introducidos durante la demostración, no clientes reales.</p><div class="tablewrap"><table class="admin-table"><tr><th>Nombre</th><th>Origen</th><th>Estado</th></tr>${(allCli.length?allCli:['Cliente demostración']).map(s=>`<tr><td><b>${esc(s)}</b></td><td>Solicitud o consulta</td><td><span class="tag teal">Demo</span></td></tr>`).join('')}</table></div></div>`;}
if(x==='solicitudes')return `<div class="panel" style="margin-top:25px"><h2 class="serif">Solicitudes</h2><div class="tablewrap"><table class="admin-table"><tr><th>Código</th><th>Cliente</th><th>Detalle</th><th>Estado</th><th>Acciones</th></tr>${state.requests.map((r,i)=>`<tr><td><b>${esc(r.code)}</b></td><td>${esc(r.name)}</td><td>${esc(r.details.slice(0,70))}</td><td><span class="tag teal">${esc(r.status)}</span></td><td><select onchange="changeStatus(${i},this.value)"><option ${r.status==='Pendiente'?'selected':''}>Pendiente</option><option ${r.status==='En atención'?'selected':''}>En atención</option><option ${r.status==='Completada'?'selected':''}>Completada</option></select></td></tr>`).join('')}</table></div></div>`;
return `<div class="panel" style="margin-top:25px"><h2 class="serif">Consultas del formulario</h2>${state.contacts.map(o=>`<div class="cart-item" style="grid-template-columns:1fr auto"><div><b>${esc(o.name)} · ${esc(o.email)}</b><small>${esc(o.text)}</small></div><span class="tag teal">${o.status}</span></div>`).join('')||'<div class="empty">Sin mensajes nuevos en esta demostración.</div>'}</div>`}
function editPrice(id){const x=prompt('Nuevo precio de demostración (S/):',state.productsOverride[id]||p(id).price);if(x&&+x>0){state.productsOverride[id]=+x;persist();render();toast('Precio de demostración actualizado')}}function changeStatus(i,s){state.requests[i].status=s;persist();render();toast('Estado actualizado localmente')}
function render(){const route=state.route;const body=route==='inicio'?home():route==='catalogo'?catalog():route==='producto'?detail():route==='carrito'?cart():route==='cotizacion'?quote():route==='confirmacion'?success():route==='acceso'?auth():route==='registro'?auth(true):route==='favoritos'?favorites():route==='cuenta'?account():route==='seguimiento'?tracking():route==='nosotros'?about():route==='contacto'?contact():route==='creditos'?credits():route.startsWith('admin')?admin():home();$('#root').innerHTML=header()+`<main id="main">${body}</main>`+(route.startsWith('admin')?'':footer())+mobileNav();document.title=(route==='inicio'?'Inicio':route.replace('-',' '))+' · Artesanias y Creaciones Juanito';}
parseHash();
</script></body></html>
